<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141310" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Pre-paint, to avoid a flash of the wrong theme. It sets one attribute
         and nothing else: every colour lives in src/index.css under
         [data-theme], so there is no palette here to drift out of sync with
         the stylesheet. */
      (function () {
        var r = document.documentElement
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark')
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          r.dataset.theme = t
          r.style.colorScheme = t
        } catch (e) {
          r.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta name="description" content="Samarth Galchar — Software Engineer working across ML, gen AI and product engineering. Boston, MA." />
    <title>Samarth Galchar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
